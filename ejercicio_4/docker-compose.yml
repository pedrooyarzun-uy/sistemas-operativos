services:
  #Servicio de nginx
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "5302:80"
    depends_on:
      - web
    networks:
      - app-network
    restart: always

  # Servicio de la aplicacion web
  web:
    build: ./web
    image: dockerfile
    depends_on:
      - redis
    networks:
      - app-network
    deploy:
      replicas: 3  # Numero de instancias de la aplicacion
    restart: always

  # Servicio de redis
  redis:
    image: "redis:alpine"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  redis_data: